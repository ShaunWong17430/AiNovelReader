[project]
name = "ainovelreader"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShaunWong17430", email = "shaunwongsgd@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3.8.0",
    "pyqt6>=6.11.0",
    "tiktoken>=0.14.0",
]

[project.scripts]
ainovelreader = "ainovelreader:main"

[build-system]
